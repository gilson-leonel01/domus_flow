services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: domusflow
      POSTGRES_USER: domusflow
      POSTGRES_PASSWORD: domusflow
    volumes:
      - domusflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U domusflow -d domusflow"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgres://domusflow:domusflow@db:5432/domusflow?sslmode=disable
      JWT_SECRET: domusflow-development-secret-change-in-production-2026
      APP_TIMEZONE: Africa/Luanda
      PORT: 8080
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  domusflow_data:
