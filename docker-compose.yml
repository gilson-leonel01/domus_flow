services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: domusflow
      POSTGRES_USER: domusflow
      POSTGRES_PASSWORD: domusflow
    volumes:
      - domusflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U domusflow -d domusflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://domusflow:domusflow@db:5432/domusflow?sslmode=disable
      JWT_SECRET: local-development-secret-change-in-production
      PORT: "8080"
      TZ: Africa/Luanda
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  domusflow_pgdata:
